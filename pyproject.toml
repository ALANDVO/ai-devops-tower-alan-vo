[project]
name = "ai-devops-tower"
version = "1.0.0"
description = "AI DevOps Control Tower - Enterprise AI-powered DevOps platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
maintainers = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
keywords = ["devops", "ai", "ml", "slo", "incident-management", "ci-cd", "release-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "requests==2.32.3",
    "httpx==0.27.2",
    "python3-saml==1.16.0",
    "authlib==1.3.1",
    "aiofiles==24.1.0",
    "orjson==3.10.7",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "python-dateutil==2.9.0",
    "pydantic-settings==2.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.27.0",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B", "C4", "ANN", "T20", "ARG", "PTH", "ERA", "PL", "TRY", "SIM", "TCH", "NPY", "RUF", "TD", "QF", "PT", "INT"]
ignore = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ARG001", "ARG002", "PTH123", "TRY003", "TCH003", "INT003"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true