version: "3.8"
services:
  devops-tower:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - devops-net

  # Optional: metrics pushgateway for SLO tracking
  # prometheus:
  #   image: prom/prometheus:latest
  #   ports: ["9090:9090"]
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #   networks:
  #     - devops-net

networks:
  devops-net:
    driver: bridge
